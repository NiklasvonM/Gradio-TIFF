[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradio_tiff"
version = "0.2.0"
description = "Custom Gradio component for multi-page TIFF images"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<4"
authors = [{ name = "Niklas von Moers", email = "niklasvmoers@protonmail.com" }]
keywords = ["gradio-custom-component", "gradio-template-ImageSlider"]
dependencies = ["gradio>=6.9,<7.0"]
classifiers = [
  'Development Status :: 3 - Alpha',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Artificial Intelligence',
  'Topic :: Scientific/Engineering :: Visualization',
]

[project.urls]
repository = "https://github.com/NiklasvonM/Gradio-TIFF/"
space = "https://huggingface.co/spaces/NiklasvonM/gradio_tiff"

[dependency-groups]
test = ["pytest>=8", "playwright>=1.45", "pytest-playwright>=0.5"]
lint = ["ruff>=0.9", "mypy>=1.14"]
# `ruff` in both `lint` and build because `gradio cc docs`
# shells out to it to format defaults and type annotations.
build = ["build", "twine", "ruff>=0.9"]
dev = [
  { include-group = "build" },
  { include-group = "test" },
  { include-group = "lint" },
]

[tool.pytest.ini_options]
markers = [
  "network: needs internet access; skipped automatically when unavailable",
]

# DOCS.md, demo/space.py and *.pyi are generated by `gradio cc docs` / gradio cc build`.
[tool.ruff]
target-version = "py310"
extend-exclude = ["DOCS.md", "demo/space.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The long lines are the `Parameters:` docstring, one line per parameter, which
# `gradio cc docs` parses to build the API table. Gradio's own components keep
# them unwrapped for the same reason.
"backend/gradio_tiff/tiff.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["backend", "tests", "demo/app.py"]
exclude = "(demo/space\\.py|.*\\.pyi)"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.hatch.build]
artifacts = ["/backend/gradio_tiff/templates", "*.pyi"]

[tool.hatch.build.targets.wheel]
packages = ["/backend/gradio_tiff"]
